id: example_breakout
version: v2
kind: condition
entry: strategy.py:Breakout
description: 예제 매매조건 — 20일 최고 종가를 넘은 종목을 다음 날 시가·장 후반 확인 후 매수 (교육용, 수익 보장 없음)
author: ktrade
params:
  lookback: 20              # 돌파 기준 기간 (거래일)
  min_price: 2000
  min_avg_value: 500000000  # 20일 평균 거래대금(원)
  max_vol_ratio: 4.0        # 돌파일 거래량이 20일 평균의 이 배수 이상이면 과열로 보고 제외
  max_extension_pct: 7      # 돌파일 종가가 직전 최고 종가보다 이만큼 넘게 오른 건 추격이라 제외
  chase_pct: 5              # 다음 날 매수 상한 = 돌파일 종가 +5%
  max_plans: 5
# 손절·익절은 쓰지 않으면 config.yaml의 exits(엔진 공통)를 쓴다. 이 조건만 바꾸려면:
# exits:
#   stop: {type: low, value: 20, buffer_pct: 1}
